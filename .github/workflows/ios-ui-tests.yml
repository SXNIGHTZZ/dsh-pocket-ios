name: iOS Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: DSHKit unit tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: Swift package tests (ordering / pending / 401)
        working-directory: DSHKit
        run: swift test

  conversation-ui:
    name: Conversation UI tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: Boot simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(dev["udid"] for runtime in d.values() for dev in runtime if dev["name"].startswith("iPhone")))')
          echo "SIM_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
      - name: Build for testing
        run: |
          xcodebuild build-for-testing -project DSHPocket.xcodeproj -scheme DSHPocket \
            -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Run UI tests
        run: |
          xcodebuild test-without-building -project DSHPocket.xcodeproj -scheme DSHPocket \
            -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/dd/Logs/Test/*.xcresult
